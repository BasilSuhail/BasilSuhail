name: README build

on:
  push:
    branches:
      - main
  schedule:
    # The Uptime clock ticks from whenever the browser loads the image, so it is
    # only as accurate as the last run. Every 30 minutes keeps the drift small.
    # Drop this to "0 4 * * *" for one run a day if the commit noise is annoying.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update profile card
        env:
          # ACCESS_TOKEN is optional: set it to a fine-grained PAT to count lines
          # of code in private repos too. Unset, today.py falls back to
          # GITHUB_TOKEN, which covers every public repository.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python today.py

      - name: Commit
        run: |-
          git config --global user.email "github-actions-bot@users.noreply.github.com"
          git config --global user.name "BasilSuhail/GitHub-Actions-Bot"
          git add .
          git commit -m "Updated profile card" -a || echo "No changes to commit"
          git push
